<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talento Lab | Contacto</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <h1 class="header__title"><i class="fas fa-rocket"></i> Talento Lab</h1>
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="../index.html" class="nav__link">Inicio</a></li>
                    <li class="nav__item"><a href="../index.html#productos" class="nav__link">Productos</a></li>
                    <li class="nav__item"><a href="../index.html#reseñas" class="nav__link">Reseñas</a></li>
                    <li class="nav__item"><a href="contacto.html" class="nav__link nav__link--active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contacto-main">
        <section class="contacto-section">
            <h2 class="section-title">Ponte en Contacto</h2>
            <p class="contacto-subtitle">¿Tienes alguna duda o consulta? Completa el formulario y nos comunicaremos a la brevedad.</p>
            
            <!-- Formulario integrado con Formspree -->
            <form action="https://formspree.io/f/mnqkwrjd" method="POST" class="contacto-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: María Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ej: usuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu consulta aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Talento Lab. Todos los derechos reservados. Desarrollado para Talento Tech.</p>
    </footer>

</body>
</html>
